server:
  host: 0.0.0.0
  port: 8000
redis:
  host: localhost
  port: 6379
  db: 0
  ttl: 3600
celery:
  broker: redis://localhost:6379/0
  backend: redis://localhost:6379/0
models:
  sd_path: E:/dp_design/housework/models/sd-v1-5
  controlnet_path: E:/dp_design/housework/models/controlnet-canny
inference:
  default_steps: 30
  default_cfg: 7.0
  default_cn_scale: 0.8
  image_size: 512
  scheduler: dpmpp_2m_karras
  control_guidance_start: 0.0
  control_guidance_end: 0.85
  prompt_suffix: "masterpiece, best quality, highly detailed, professional composition, realistic lighting"
  negative_prompt: "low quality, worst quality, blurry, deformed, distorted, bad anatomy, bad proportions, extra limbs, duplicate, watermark, text, logo, jpeg artifacts"
canny:
  low_threshold: 100
  high_threshold: 200
experiment:
  dataset_root: E:/dp_design/housework/data/sketchy
  output_dir: E:/dp_design/housework/outputs/experiment
  categories:
    - airplane
    - cat
    - dog
    - car_(sedan)
    - horse
  sample_index: 0
  seed: 42
  inference_steps: 15
  width: 512
  height: 512
  baseline_control_scale: 0.0
  main_control_scale: 0.8
  ablation_scales:
    - 0.0
    - 0.4
    - 0.8
    - 1.2
    - 1.6
  clip_model: openai/clip-vit-base-patch32
  fid_feature_dim: 64
